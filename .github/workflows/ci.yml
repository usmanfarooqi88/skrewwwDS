name: CI

on:
  push:
    branches: [main]
  pull_request:

# A PR that only edits docs still gets a cheap green check from this job;
# splitting into multiple workflows would re-install dependencies per job for
# no real benefit at this repository's size.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Matches package.json engines and .nvmrc (Node 24.x line).
          node-version-file: .nvmrc
          cache: npm

      # Install scripts stay blocked deliberately — see docs/contributing.md.
      # The build does not need sharp/esbuild/unrs-resolver lifecycle scripts.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # `npm run build` runs generate:registry and generate:agent-context
      # first, so this also proves both generators work from a clean clone
      # and that a production build emits current public artifacts.
      - name: Build (includes registry + Agent Kit generation)
        run: npm run build

      # INTERNAL repo Guard only (not @skrewww/guard@beta). Must run after
      # build so public/r + public/agent/contracts exist; otherwise two
      # distribution rules vacuous-pass on a clean checkout. Observe-only:
      # continue-on-error keeps the required verify job green.
      - name: Guard (internal, observe-only)
        continue-on-error: true
        run: npm run guard -- --internal .

      - name: Verify generated artifacts are not tracked
        # A contributor accidentally committing public/r or public/agent would
        # make this dirty; generated output must stay gitignored.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Build produced tracked changes — generated artifacts must stay gitignored."
            git status --porcelain
            exit 1
          fi
